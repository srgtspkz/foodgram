[flake8]
exclude =
    */migrations/,
    data/,
    docs/,
    frontend/,
    infra/,
    venv/
per-file-ignores =
    */settings.py:E501,
    */0001_initial.py:E501
    */serializers.py:E501
    */views.py:E501

[mypy]
ignore_missing_imports = True
disable_error_code = assignment

[pylint.messages_control]
disable =
    C0103,
    C0415,
    E1101,
    W0223, W0237, W0613, W0622

[isort]
profile = black
