services:
  db:
    image: postgres:16.15
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: srgtspkz/foodgram_backend
    env_file: .env
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - db

  frontend:
    image: srgtspkz/foodgram_frontend
    volumes:
      - frontend_volume:/app/result_build

  nginx:
    image: srgtspkz/foodgram_nginx
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - static_volume:/staticfiles:ro
      - media_volume:/media:ro
      - frontend_volume:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend

volumes:
  pg_data:
  static_volume:
  media_volume:
  frontend_volume:
